<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Seal IPTV setup</title>
<style>
  :root { color-scheme: dark; --bg: #121418; --bg2: #1b1f26; --line: #2c313b; --text: #e8eaee; --muted: #9aa1ad; --accent: #3ccf91; --bad: #ff7a7a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 21px; margin: 4px 0 16px; }
  .logo { font-size: 22px; }
  label { display: block; margin: 12px 0 5px; font-size: 14px; color: var(--muted); }
  input { width: 100%; padding: 12px; font-size: 16px; color: var(--text); background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; }
  input:focus { outline: none; border-color: var(--accent); }
  .tabs { display: flex; gap: 6px; margin: 16px 0 4px; }
  .tabs button { flex: 1; padding: 10px 6px; font-size: 14px; color: var(--muted); background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; }
  .tabs button.on { color: #0b1a12; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .note { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
  .send { width: 100%; margin-top: 20px; padding: 14px; font-size: 17px; font-weight: 600; color: #0b1a12; background: var(--accent); border: 0; border-radius: 12px; }
  .send:disabled { opacity: .6; }
  .msg { min-height: 1.4em; margin: 14px 0 0; }
  .msg.ok { color: var(--accent); }
  .msg.bad { color: var(--bad); }
  .small { color: var(--muted); font-size: 12.5px; margin-top: 24px; }
</style>
</head>
<body>
<div id="app"></div>
<script>/*PAGE_JS*/</script>
</body>
</html>
